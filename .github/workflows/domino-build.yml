name: Domino Android Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'domino-android/**'
      - '.github/workflows/domino-build.yml'
  pull_request:
    paths:
      - 'domino-android/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: domino-android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Domino-debug-apk
          path: domino-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
