name: IPTV Android Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'iptv-player/**'
      - '.github/workflows/iptv-build.yml'
  pull_request:
    paths:
      - 'iptv-player/**'
      - '.github/workflows/iptv-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        working-directory: iptv-player
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-release-unsigned
          path: iptv-player/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
